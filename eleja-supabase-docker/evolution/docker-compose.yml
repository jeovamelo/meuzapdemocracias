services:
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    networks:
      - democracias-net

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: always
    depends_on:
      - evolution-redis
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`evolution.democracias.org`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.routers.evolution.middlewares=evolution-auth"
      - "traefik.http.middlewares.evolution-auth.headers.customrequestheaders.apikey=${EVOLUTION_MASTER_TOKEN}"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    environment:
      - SERVER_PORT=8080
      - CLIENT_NAME=democracias
      - GLOBAL_API_KEY=${EVOLUTION_GLOBAL_API_KEY}
      - AUTH_API_KEY=${EVOLUTION_GLOBAL_API_KEY}
      - POSTGRES_AUTH_DB=${EVOLUTION_POSTGRES_AUTH_DB}
      - POSTGRES_USERS_DB=${EVOLUTION_POSTGRES_AUTH_DB}
      - DATABASE_SAVE_MESSAGES=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - QRCODE_LIMIT=30
    volumes:
      - evolution_go_data:/app/data
    networks:
      - democracias-net

volumes:
  evolution_go_data:
  evolution_redis_data:

networks:
  democracias-net:
    external: true
