version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=https://api.democracias.org
      - AUTH_API_KEY=${EVOLUTION_GLOBAL_API_KEY:-democracias_global_evolution_key_2026}
      
      # DATABASE PERSISTENCE IN SUPABASE (PostgreSQL)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${SUPABASE_POSTGRES_DIRECT_URL:-postgres://postgres:postgres@supabase-db:5432/postgres}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_MESSAGES=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      
      # GLOBAL WEBHOOKS
      - WEBHOOK_GLOBAL_URL=https://api.democracias.org/api/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_AUTO_DOWNLOAD=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - democracias-net

volumes:
  evolution_instances:

networks:
  democracias-net:
    external: true
